[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chess-bot"
version = "0.1.0"
description = "Level-based chess engine (8 levels) with live Elo tracking and tournaments"
requires-python = ">=3.11"
dependencies = [
    "chess>=1.11.2",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.28.0", "plotly>=5.18.0", "pandas>=2.0.0"]
llm = ["anthropic>=0.40.0"]
research = ["torch>=2.2.0", "matplotlib>=3.8.0", "jupyter>=1.0.0"]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0", "black>=23.0.0", "mypy>=1.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["engine", "tournament", "elo", "llm", "research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: longer self-play matches"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
